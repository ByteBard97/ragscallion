[project]
name = "ragscallion"
version = "0.1.0"
description = "A scrappy, local-first RAG server for coding agents. Hybrid search over your docs via HTTP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.104.0",
    "lancedb>=0.29.2",
    "pandas>=3.0.1",
    "python-multipart>=0.0.6",
    "rich>=14.3.3",
    "sentence-transformers>=5.2.3",
    "tantivy>=0.25.1",
    "torch>=2.10.0",
    "uvicorn>=0.24.0",
]
